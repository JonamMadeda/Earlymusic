name: CI

# Manual only. Actions compute is not billed for a public repo, but this
# account is locked for billing reasons, so a push trigger can never start a
# runner and only leaves a red X that means nothing. Verification happens
# locally before every push instead:
#   npm run lint && npm run typecheck && npm test && npm run build
# Restore the push and pull_request triggers once the account lock is lifted.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # next build imports every route module to collect its config, and
          # lib/neon.js calls neon() at module scope, so the build fails without
          # a connection string even though nothing is ever queried here.
          # Placeholders keep real credentials out of GitHub; the values that
          # matter live in the Vercel project's environment.
          NEON_DATABASE_URL: postgresql://ci-placeholder:ci-placeholder@endpoint.neon.tech/ci-placeholder
          NEXT_PUBLIC_R2PUBLICURL: https://ci-placeholder.invalid
