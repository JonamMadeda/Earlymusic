name: Android APK

# Builds the Luumbo TWA (Trusted Web Activity) shell around https://luumbo.vercel.app
# and publishes the signed APK + AAB to a GitHub Release.
#
# DORMANT: this account is locked for billing reasons, so no runner will start
# (see the note in ci.yml). The APK is currently built locally with the same
# Bubblewrap version and uploaded with `gh release upload`. Clear the lock and
# this workflow takes over.
#
# The project itself lives in /android and is generated by Bubblewrap; the
# source of truth is android/twa-manifest.json. To change app name, icons,
# orientation or the trusted host, edit that file, then run
# `cd android && bubblewrap update` and commit the regenerated project.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. android-v1.0.0)'
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    env:
      # Keystore layout on this machine: the master copy lives outside the repo
      # and is never committed. CI restores it from a secret.
      BUBBLEWRAP_VERSION: 1.27.0
      BUILD_TOOLS_VERSION: 36.1.0
      PLATFORM_VERSION: android-36

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # Bubblewrap rejects anything but JDK 17

      - name: Restore the Android SDK layout Bubblewrap expects
        run: |
          VERSION=$(curl -s https://dl.google.com/android/repository/repository2-3.xml -o - \
            | grep -o 'commandlinetools-linux-[0-9]*_latest.zip' | head -1)
          curl -sSL -o /tmp/tools.zip "https://dl.google.com/android/repository/${VERSION}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q -o /tmp/tools.zip -d /tmp/tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          # Bubblewrap looks for sdkmanager in <sdk>/tools/bin or <sdk>/bin.
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            --licenses > /dev/null
          "$ANDROID_HOME/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Install Bubblewrap
        run: npm install -g "@bubblewrap/cli@$BUBBLEWRAP_VERSION"

      - name: Point Bubblewrap at the toolchain
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e '
            const fs = require("fs");
            fs.writeFileSync(`${process.env.HOME}/.bubblewrap/config.json`, JSON.stringify({
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME,
            }, null, 2));
          '
          bubblewrap doctor

      - name: Restore the release keystore
        run: |
          echo "${{ secrets.LUMMBO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build the signed APK and App Bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.LUMMBO_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.LUMMBO_KEY_PASSWORD }}
        run: bubblewrap build --signingKeyPath="$RUNNER_TEMP/release.keystore"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            "android/app-release-signed.apk#Luumbo Android (APK)" \
            "android/app-release-bundle.aab#Luumbo Android (AAB for Play Store)" \
            || gh release upload "$TAG" --clobber \
            "android/app-release-signed.apk#Luumbo Android (APK)" \
            "android/app-release-bundle.aab#Luumbo Android (AAB for Play Store)"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
